# ---------------------------------------------------------------------------
# Project monorepo CI — paired plan + apply workflows for a project repo
# (e.g. sample-infra, client-A-infra). Drop the two YAML blocks below into
# .github/workflows/terraform-plan.yml and .github/workflows/terraform-apply.yml
# respectively (split because GitHub Actions does not support two `on:`
# triggers in one workflow file with different gating logic).
#
# What runs (set by the central reusable workflow):
#   fmt -> gitleaks (OSS binary, repo-wide) -> per-service matrix
#   { tflint -> tfsec -> checkov -> OIDC -> init -> plan -> conftest
#     against terraform-policies@v1 -> infracost (Tier-2, informational) }.
#
# Apply path adds: terraform apply (gated by the GitHub Environment).
# ---------------------------------------------------------------------------

# ===========================================================================
# .github/workflows/terraform-plan.yml — runs on every PR
# ===========================================================================
# name: Terraform Plan
#
# on:
#   pull_request:
#     branches: [main]
#
# permissions:
#   id-token: write       # OIDC into the target AWS account
#   contents: read
#   pull-requests: write  # plan summary comment
#

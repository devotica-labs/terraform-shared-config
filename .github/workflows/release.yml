# Release workflow for terraform-shared-config.
#
# This is a config-only repo (no .tf files), so the release pipeline is
# light: release-please opens the version-bump PR, and on merge it tags
# the new vX.Y.Z. We additionally repoint the floating @v1 tag to the
# new release so consumers pinned at @v1 pick it up automatically on
# their next CI run.
#
# Per terraform-shared-config README versioning policy.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write       # write tags + create the release
  pull-requests: write  # release-please opens release PRs

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-22.04
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      major: ${{ steps.rp.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4.1.3
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  retag-floating-major:
    name: Repoint floating v${{ needs.release-please.outputs.major }} tag
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      MAJOR: ${{ needs.release-please.outputs.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move floating v<MAJOR> tag to new release
        run: |
          set -euo pipefail
          git config user.name  "devotica-bot"
          git config user.email "bot@devotica.com"

          echo "Re-pointing v${MAJOR} -> ${TAG_NAME}"
          git tag -fa "v${MAJOR}" \
            -m "Floating v${MAJOR} tag — auto-tracks latest v${MAJOR}.x.y. Currently points at ${TAG_NAME}." \
            "${TAG_NAME}"
          git push origin "v${MAJOR}" --force

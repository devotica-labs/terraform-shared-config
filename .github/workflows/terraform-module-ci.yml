# Reusable CI workflow for Devotica Terraform module repos.
#
# Consumed by: every github.com/devotica-labs/terraform-aws-* repo.
#
# Why this exists:
#   One canonical pipeline definition for the entire module catalog.
#   Bumping a tool version, adding a check, tightening a gate — single PR
#   here propagates to all modules on next consumer-side @vX.Y.Z bump.
#
# Inputs let consumers turn individual jobs off when they don't apply
# (e.g. a docs-only module skipping infracost). Defaults err on the strict side.

name: terraform-module-ci

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform version pin"
        type: string
        default: "1.9.5"
      working-directory:
        description: "Path within the consuming repo to run from"
        type: string
        default: "."
      run-terraform-test:
        description: "Run native terraform test (unit + contract layers)"
        type: boolean
        default: true
      run-tflint:
        description: "Run tflint with AWS plugin"
        type: boolean
        default: true
      run-tfsec:
        description: "Run tfsec (HIGH/CRITICAL fail)"
        type: boolean
        default: true
      run-checkov:
        description: "Run Checkov (informational at first; flip to blocking once tuned)"
        type: boolean
        default: true
      run-conftest:
        description: "Run conftest with the OPA policy pack"
        type: boolean
        default: true
      run-terraform-docs-check:
        description: "Verify README terraform-docs section is up to date"
        type: boolean
        default: true
      run-infracost:
        description: "Post Infracost diff comment on PRs"
        type: boolean
        default: true
      run-examples-build:
        description: "Run terraform validate inside every examples/* subdirectory"
        type: boolean
        default: true
      checkov-blocking:
        description: "Fail the build on Checkov findings (default: inform-only)"
        type: boolean
        default: false
      conftest-policy-ref:
        description: "Git ref of devotica-labs/terraform-policies to use"
        type: string
        default: "v1"
      gitleaks-version:
        description: "OSS gitleaks binary version (no paid license needed)"
        type: string
        default: "8.18.4"
      conftest-version:
        description: "Conftest binary version. Must bundle OPA >= 0.59 to understand `import rego.v1` in modern policy packs."
        type: string
        default: "0.56.0"
      terraform-docs-auto-update:
        description: "Bot pushes regenerated README back to the PR branch instead of failing on diff"
        type: boolean
        default: false
      examples-build-targets:
        description: 'JSON array of subdirectory names under examples/ to validate (e.g. ''["basic","complete","with-ipv6"]''). Modules with non-standard layouts override this.'
        type: string
        default: '["basic","complete"]'
      terraform-test-files:
        description: 'JSON array of .tftest.hcl files (relative to working-directory) to run as the unit + contract gate. Integration tests should NOT be listed here — they belong in a workflow_dispatch flow.'
        type: string
        default: '["tests/unit.tftest.hcl","tests/contract.tftest.hcl"]'
      conftest-plan-from:
        description: 'Subpath under working-directory to render the conftest plan from. Default "examples/basic" because module roots have required variables and cannot be planned in isolation. Set to "." only for modules with no required vars.'
        type: string
        default: "examples/basic"
    secrets:
      INFRACOST_API_KEY:
        description: "Infracost API key (free tier ok). When unset, the infracost job skips silently."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # -----------------------------------------------------------------
  # Tier 1 — block: cheap, deterministic, shared across every layer.
  # -----------------------------------------------------------------
  fmt:
    name: terraform fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
        working-directory: ${{ inputs.working-directory }}

  validate:
    name: terraform validate
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: terraform init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ inputs.working-directory }}
      - name: terraform validate
        run: terraform validate
        working-directory: ${{ inputs.working-directory }}

  tflint:
    name: tflint
    if: ${{ inputs.run-tflint }}
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.0.0
        with:
          tflint_version: v0.50.3
      - name: tflint init (download AWS plugin)
        run: tflint --init
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint
        run: tflint --recursive --format compact
        working-directory: ${{ inputs.working-directory }}

  tfsec:
    # NOTE: tfsec-action blocked by Aquasecurity org IP allowlist on GitHub runners.
    # Replaced with trivy (same company, same scanner, no IP restriction).
    name: tfsec (trivy)
    if: ${{ inputs.run-tfsec }}
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ${{ inputs.working-directory }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      # OSS binary avoids the paid org-license requirement of gitleaks-action.
      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

  checkov:
    name: checkov
    if: ${{ inputs.run-checkov }}
    runs-on: ubuntu-22.04
    needs: fmt
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: bridgecrewio/checkov-action@4048c972aae68d0b983a48bb3479aab2d877b898 # v12.3102.0
        with:
          directory: ${{ inputs.working-directory }}
          framework: terraform
          quiet: true
          soft_fail: ${{ !inputs.checkov-blocking }}

  conftest:
    name: conftest (OPA policies)
    if: ${{ inputs.run-conftest }}
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Pull policy pack
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: devotica-labs/terraform-policies
          ref: ${{ inputs.conftest-policy-ref }}
          path: .policies
      - name: Resolve conftest plan target
        id: target
        env:
          ROOT_DIR: ${{ inputs.working-directory }}
          SUB_DIR: ${{ inputs.conftest-plan-from }}
        run: |
          set -euo pipefail
          # Join working-directory + conftest-plan-from with sensible handling
          if [ "$SUB_DIR" = "." ] || [ -z "$SUB_DIR" ]; then
            TARGET="$ROOT_DIR"
          else
            TARGET="${ROOT_DIR%/}/$SUB_DIR"
          fi
          if [ ! -d "$TARGET" ]; then
            echo "::warning::conftest-plan-from='$SUB_DIR' resolves to '$TARGET' which does not exist; falling back to '$ROOT_DIR'. Add an examples/basic caller or override conftest-plan-from."
            TARGET="$ROOT_DIR"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Using plan target: $TARGET"
      - name: Render plan JSON
        working-directory: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          terraform init -backend=false
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
      - name: Install and run conftest
        # NOTE: instrumenta/conftest-action@v0.5.1 does not exist on GitHub.
        # Using the upstream binary directly instead.
        env:
          CONFTEST_VERSION_OVERRIDE: ${{ inputs.conftest-version }}
        run: |
          set -euo pipefail
          CONFTEST_VERSION="${CONFTEST_VERSION_OVERRIDE:-0.56.0}"
          curl -sSLo conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          mv conftest /usr/local/bin/
          conftest --version
          conftest test "${{ steps.target.outputs.target }}/tfplan.json" \
            --policy .policies/policies/ \
            --all-namespaces

  terraform-test:
    name: terraform test (unit + contract)
    if: ${{ inputs.run-terraform-test }}
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend=false
        working-directory: ${{ inputs.working-directory }}
      - name: terraform test
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_FILES: ${{ inputs.terraform-test-files }}
        run: |
          set -euo pipefail
          # Loop over the JSON array, run each file as its own gate so the
          # log groups stay readable. jq is preinstalled on ubuntu-22.04.
          echo "${TEST_FILES}" | jq -r '.[]' | while read -r f; do
            if [ -z "${f}" ]; then continue; fi
            echo "::group::terraform test -filter=${f}"
            terraform test -filter="${f}"
            echo "::endgroup::"
          done

  terraform-docs:
    name: terraform-docs verify
    if: ${{ inputs.run-terraform-docs-check }}
    runs-on: ubuntu-22.04
    needs: fmt
    permissions:
      # Needs write to push the regenerated README back when auto-update is on.
      # Read is sufficient when auto-update is off (the default).
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # Verify-only mode: fail if README drifted, do not push.
      - name: terraform-docs verify (no auto-update)
        if: ${{ !inputs.terraform-docs-auto-update }}
        uses: terraform-docs/gh-actions@aeae0038ed47a547e0c0fca5c059d3335f48fb25 # v1.3.0
        with:
          working-dir: ${{ inputs.working-directory }}
          config-file: .terraform-docs.yml
          fail-on-diff: true

      # Auto-update mode: regenerate, commit, push back to the PR branch.
      - name: terraform-docs auto-update
        if: ${{ inputs.terraform-docs-auto-update && github.event_name == 'pull_request' }}
        uses: terraform-docs/gh-actions@aeae0038ed47a547e0c0fca5c059d3335f48fb25 # v1.3.0
        with:
          working-dir: ${{ inputs.working-directory }}
          config-file: .terraform-docs.yml
          output-file: README.md
          output-method: inject
          git-push: true
          git-commit-message: "chore(docs): regenerate terraform-docs"

  examples-build:
    name: examples build
    if: ${{ inputs.run-examples-build }}
    runs-on: ubuntu-22.04
    needs: validate
    strategy:
      matrix:
        example: ${{ fromJSON(inputs.examples-build-targets) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: terraform init
        run: terraform init -backend=false
        working-directory: ${{ inputs.working-directory }}/examples/${{ matrix.example }}
        continue-on-error: true # not every module ships both examples
      - name: terraform validate
        run: |
          if [ -d "${{ inputs.working-directory }}/examples/${{ matrix.example }}" ]; then
            cd "${{ inputs.working-directory }}/examples/${{ matrix.example }}"
            terraform validate
          else
            echo "examples/${{ matrix.example }} not present — skipping"
          fi

  # -----------------------------------------------------------------
  # Tier 2 — informational: posts results, never blocks the build.
  # -----------------------------------------------------------------
  infracost:
    name: infracost (PR comment)
    # Tier-2 informational job: never blocks the build. continue-on-error
    # ensures a missing API key, network blip, or infracost CLI hiccup
    # does not turn a green PR red.
    if: ${{ inputs.run-infracost && github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Skip when API key not provided
        id: precheck
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "${INFRACOST_API_KEY:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "INFRACOST_API_KEY not set on this repo/org — skipping cost diff comment."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.precheck.outputs.skip != 'true'
        uses: infracost/actions/setup@d51fc54d23c9ad90f984b884257bd96dc2625067 # v4.1.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Infracost breakdown
        if: steps.precheck.outputs.skip != 'true'
        env:
          WORKDIR: ${{ inputs.working-directory }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -d "${WORKDIR}/examples/complete" ]; then
            infracost breakdown \
              --path "${WORKDIR}/examples/complete" \
              --format json --out-file /tmp/infracost.json
            infracost comment github \
              --path /tmp/infracost.json \
              --repo "${REPO}" \
              --pull-request "${PR_NUMBER}" \
              --github-token "${{ github.token }}" \
              --behavior update
          else
            echo "examples/complete missing — skipping infracost"
          fi
